[package]
name = "reacon-sdk"
version = "0.2.0-beta.1"
authors = ["Reacon <achazal@reacon.io>"]
description = "Official Reacon API client for Rust"
homepage = "https://reacon.io"
repository = "https://github.com/reacon-io/reacon-rust"
documentation = "https://docs.reacon.io/sdks"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.88"

[dependencies]
async-stream = "=0.3.6"
eventsource-stream = "=0.2.3"
futures-util = "=0.3.34"
tokio = { version = "1", features = ["time"] }
serde = { version = "^1.0", features = ["derive"] }
serde_with = { version = "^3.8", default-features = false, features = ["base64", "std", "macros"] }
serde_json = "^1.0"
serde_repr = "^0.1"
serde_path_to_error = "^0.1"
url = "^2.5"
uuid = { version = "^1.8", features = ["serde", "v4"] }
reqwest = { version = "^0.13", default-features = false, features = ["json", "multipart", "query", "form", "stream"] }

[features]
default = ["rustls"]
native-tls = ["reqwest/native-tls"]
rustls = ["reqwest/rustls"]
